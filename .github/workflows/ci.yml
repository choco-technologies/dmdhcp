name: CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
jobs:
  build-and-test:
    name: Build and Test (${{ matrix.tools }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tools: [arch/x86_64, arch/armv7/cortex-m4, arch/armv7/cortex-m7]
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4
    steps:
      - uses: actions/checkout@v4
      - name: Build modules
        run: |
          cmake -S . -B build -DDMOD_MODE=DMOD_MODULE -DDMOD_TOOLS_NAME=${{ matrix.tools }}
          cmake --build build --parallel 2
      - name: Verify artifacts
        run: |
          test -f build/dmf/dmdhcp.dmf
          test -f build/dmf/test_dmdhcp.dmf
          test -f build/dmf/dhcpc.dmf
      - name: Run native tests
        if: matrix.tools == 'arch/x86_64'
        run: ctest --test-dir build --output-on-failure
