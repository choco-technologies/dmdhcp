; dhcp@.ini - libsystemd unit template, one instance per network interface
; that should acquire an address by DHCP.
;
; Not auto-instantiated from a device rule the way networkd@.ini is: dmnet's
; networkd.rules already maps device class "netif" to networkd@%name, and
; libsystemd only honors the first rules file that defines a given class -
; adding a second [class=netif] rule here would either lose to networkd's
; silently (no interface ever gets DHCP) or replace it silently (no
; interface ever gets its RX pump, breaking every other protocol on it),
; depending on load order. Since not every interface should run a DHCP
; client in the first place (a statically-addressed uplink, a bridge
; member, a loopback...), that trade-off isn't one worth making.
;
; Drop a dhcp@<interface>.ini instance file (even an empty one - it
; inherits everything below) into libsystemd's units directory for each
; interface that should run dhcpc, the same way getty@tty1.ini instantiates
; getty@.ini. See ../../../docs/service.md for the full setup.
;
; %i is the interface name ("eth0"), which is all dhcpc needs.
description=Acquire a DHCP lease for %i
exec=dhcpc
args=%i
type=oneshot
after=dhcp,networkd@%i
requires=dhcp,networkd@%i
