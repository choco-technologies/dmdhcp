; dhcp@.ini - libsystemd unit template, one instance per network interface
; that should acquire an address by DHCP.
;
; No requires=/after= on "networkd@%i": dhcpc's only job is to call
; dmdhcp_start(), which just registers the lease and sends the first
; DISCOVER - it does not need the interface's RX pump already running
; (dmdhcp retries DISCOVER on its own retransmission timer until an OFFER
; actually arrives, whenever networkd@%i gets there). dmdhcp itself needs no
; separate unit either: dhcpc links dmdhcp_if directly (see
; ../CMakeLists.txt), so loading dhcpc - however it gets started -
; loads+enables dmdhcp as its own module dependency, the same way tools/ping
; pulls dmicmp in for dmicmp's own tests.
;
; See ../../../docs/service.md for the full setup, including
; configs/dhcp.rules, which is what actually instantiates this per
; interface.
;
; %i is the interface name ("eth0"), which is all dhcpc needs.
description=Acquire a DHCP lease for %i
exec=dhcpc
args=%i
type=oneshot
