# dhcp.ini - dmsystem unit that loads and enables the dmdhcp module at boot,
# so DHCP leases can be acquired on demand. Drop it into libsystemd's units
# directory - see dmsystem's configuration docs
# (https://github.com/choco-technologies/dmsystem/blob/main/app/libsystemd/docs/configuration.md#typelibrary-services-backed-by-a-library-module-not-a-process).
description=Load the dmdhcp module so DHCP leases can be acquired
exec=dmdhcp
type=library

# type=library: dmdhcp is a Library-type DMOD module, not an Application - it
# has no main(), so it cannot be spawned as a process the way a "simple"/
# "oneshot" unit is. type=library tells libsystemd to load+enable "exec" as a
# module instead (the DMOD loader's own module lifecycle) when the unit is
# started, and to disable+unload it when the unit is stopped - see
# ../docs/service.md.
#
# Unlike dmicmp's icmp.ini, loading dmdhcp here does not by itself start
# acquiring a lease on any interface - dmdhcp keeps no state of its own
# until something calls dmdhcp_start(iface, ...). tools/dhcpc's dhcp@.ini
# template does exactly that, once per interface, requiring this unit
# first - see ../docs/service.md.
